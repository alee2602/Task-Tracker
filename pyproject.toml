[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasktracker"
version = "0.1.0"
description = "Simple CLI task tracker"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "dateparser>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
task = "tasktracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
